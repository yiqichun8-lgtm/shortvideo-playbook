promotion_budget: 8

entry:
  name: canyin-shortvideo-course
  description: |
    餐饮/本地实体店短视频实操方法：账号定位、选题生成、四类脚本（聊观点/晒过程/教知识/讲故事）、发布前自检，以及拍剪执行与团队搭建。
    当用户提到餐饮店、实体店、本地门店做抖音/视频号/小红书短视频，询问怎么定位、拍什么、怎么写脚本、为什么没人看、这条行不行时使用。
    仅做投流、平台后台操作、菜品研发、门店管理等非内容问题时不使用。
  core_principles:
    - 先定位后内容：先确定"用户为什么进店"（进店理由），再决定拍什么——顺序倒了有流量也不变现
    - 定位的三验收：成交理由充足 + 看起来是真事儿 + 能高频出现 = 水桶型漏斗成立
    - 爆款选题是乘法：一个定位正确的普通选题 × 一个爆款元素（或词根），不是灵感
    - 四类脚本各有固定结构，是填空题不是创作题：聊观点（论据）/ 晒过程（火车节）/ 教知识（四型）/ 讲故事（桥段）
    - 原生感 > 精致感：观众相信"生活中的这个人"，假的东西有技巧有流量也不变现
    - 留存优先：判断标准是均播时长不是点赞数，留住平台用户的时间才换得到流量
    - 发布前过七问：不管写完什么，先判定"通过 / 修改后通过 / 暂不发布"
  out_of_scope:
    - 付费投流（千川/抖加）的操作与出价策略
    - 平台后台的具体操作、违规申诉流程
    - 菜品研发、成本控制、门店人力管理等非内容经营的专项问题
    - 与你无关的其他行业账号（本 Bundle 的所有能力默认服务于有真实产品或服务的实体店）
    - 需要实时数据（当日热点、榜单）的问题——本 Bundle 不联网取数
  stop_conditions:
    - 用户没有明确的产品/服务，或答不出任何一条进店理由 → 停止出脚本，回到"先把生意的可信点理清楚"
    - 用户要求用擦边/虚假/夸大功效的方式获取流量 → 明确拒绝并给出合规替代
    - 用户要的是投流、后台操作或实时数据 → 明确告知超出本 Bundle 范围，不要硬套
    - 同一需求连续两套方案都不通过七问自检 → 停下来问清楚目标人群，而不是继续换写法
    - 不要引用本书之外的"平台内部规则"，也不要承诺具体数据效果

